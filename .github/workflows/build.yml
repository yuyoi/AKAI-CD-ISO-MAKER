name: build

on:
  push:
    branches: [master]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: windows
          - os: ubuntu-22.04        # old glibc so the binary runs on most distros
            label: linux
          - os: macos-latest        # Apple Silicon
            label: macos-arm64
          - os: macos-15-intel      # Intel Macs
            label: macos-intel
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: System libraries (Linux)
        if: matrix.label == 'linux'
        run: sudo apt-get update && sudo apt-get install -y libportaudio2 libsndfile1
      - name: Install
        run: python -m pip install numpy scipy soundfile sounddevice pyinstaller
      - name: "Tests (the real-disc round trip is skipped in CI, no Akai discs there)"
        run: |
          python tests/test_make.py
          python tests/test_roundtrip.py
      - name: Build (Windows exe)
        if: matrix.label == 'windows'
        run: >
          pyinstaller --noconfirm --onefile --windowed --name AkaiCDISOMaker
          --collect-binaries soundfile --collect-binaries sounddevice
          --exclude-module matplotlib --exclude-module pandas --exclude-module IPython --exclude-module pytest
          akai_cd_iso_maker.py
      - name: Build (Linux binary)
        if: matrix.label == 'linux'
        run: |
          pyinstaller --noconfirm --onefile --windowed --name AkaiCDISOMaker             --collect-binaries soundfile --collect-binaries sounddevice             --exclude-module matplotlib --exclude-module pandas --exclude-module IPython --exclude-module pytest             akai_cd_iso_maker.py
          tar -C dist -czf AkaiCDISOMaker-linux-x86_64.tar.gz AkaiCDISOMaker
      - name: Build (macOS app)
        if: startsWith(matrix.label, 'macos')
        run: |
          pyinstaller --noconfirm --windowed --name AkaiCDISOMaker --osx-bundle-identifier com.junksmithwizard.akaicdisomaker \
            --collect-binaries soundfile --collect-binaries sounddevice \
            --exclude-module matplotlib --exclude-module pandas --exclude-module IPython --exclude-module pytest \
            akai_cd_iso_maker.py
          cd dist && ditto -c -k --keepParent AkaiCDISOMaker.app ../AkaiCDISOMaker-${{ matrix.label }}.zip
      - name: Rename Windows exe
        if: matrix.label == 'windows'
        run: Move-Item dist/AkaiCDISOMaker.exe AkaiCDISOMaker-windows.exe
        shell: pwsh
      - uses: actions/upload-artifact@v4
        with:
          name: AkaiCDISOMaker-${{ matrix.label }}
          path: |
            AkaiCDISOMaker-windows.exe
            AkaiCDISOMaker-${{ matrix.label }}.zip
            AkaiCDISOMaker-linux-x86_64.tar.gz
          if-no-files-found: ignore
      - name: Attach to the release
        if: github.event_name == 'release'
        shell: bash
        run: gh release upload "${{ github.event.release.tag_name }}" AkaiCDISOMaker-* --clobber
        env:
          GH_TOKEN: ${{ github.token }}
